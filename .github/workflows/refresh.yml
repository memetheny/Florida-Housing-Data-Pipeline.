name: Refresh housing chart
on:
  schedule:
    - cron: "0 12 20 * *"   # monthly; change the day if you want
  workflow_dispatch:         # adds a "Run workflow" button
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add florida_growth.png florida_growth.csv
          git diff --staged --quiet || git commit -m "Refresh chart and data"
          git push
